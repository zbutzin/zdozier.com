summary_statement: "I am an Assistant Professor at Stanford School of Medicine (Department of Pediatrics, Division of Clinical Informatics; Department of Medicine, Division of Computational Medicine) with a strong ability to communicate complex methods and findings to a broad range of audiences. My research applies machine learning for causal inference via electronic health record (EHR) data. This work is supported by an NIAID K01 award and primarily uses data from Epic Cosmos, PEDSnet, the UC Health Data Warehouse, and the National Clinical Cohort Collaborative."

# From the CV "Research" section. end: null means Present.
appointments:
  - title: "Assistant Professor"
    org: "Stanford University School of Medicine"
    unit: "Department of Pediatrics (Clinical Informatics) and Department of Medicine (Computational Medicine / Center for Biomedical Informatics Research)"
    start: "June 2026"
    end: null
    description: "I lead an independent research program applying artificial intelligence and machine learning for causal inference via electronic health record data to improve pediatric health. As an NIAID K01 scholar, I am building a lab with access to Epic COSMOS, PEDSnet, PCORnet, UCHDW, and N3C."
  - title: "Postdoctoral Scholar"
    org: "UC Berkeley School of Public Health"
    unit: "Division of Biostatistics, Center for Targeted Machine Learning"
    start: "September 2022"
    end: "May 2026"
    description: "My work applies a Targeted Machine Learning methodology (applied machine learning for causal inference) to evaluate interventions against Long COVID. I am an NIAID K01 scholar (2025-2029), my work was pivotal in maintaining continued funding from the Bill and Melinda Gates Foundation, I facilitated a Data Use Agreement between N3C and UC Berkeley, I led a team to third place in the NIH Long COVID Computational Challenge, and I forged multiple inter-institutional collaborations (UNC-Chapel Hill, Johns Hopkins, University of Washington, University of Minnesota, University of Alabama at Birmingham Medical Center)."
  - title: "Graduate Student Researcher"
    org: "UC Berkeley"
    unit: null
    start: "January 2020"
    end: "August 2022"
    description: "Worked under Professors Jack Colford, Alan Hubbard, and Mark van der Laan. Applied Targeted Learning methodology to data from the WASH Benefits Bangladesh Project. This work culminated in three first-author publications and several supporting-author publications."
  - title: "Graduate Student Researcher"
    org: "UC Berkeley/Universidad San Francisco de Quito"
    unit: null
    start: "May 2019"
    end: "August 2019"
    description: "Led a mixed-methods research project on antimicrobial resistance in Ecuador. This work culminated in one first-author publication and two supporting-author publications."

