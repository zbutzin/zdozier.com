# Curated publication settings. merge.py reads this file; every key is optional.
# DOIs are written in lowercase. Contribution notes are copied from the Word CV
# (updated August 19, 2026).

# Filter chips on /publications/, in display order. ids are fixed slugs.
topics:
  - {id: causal-ml, label: "Causal inference and machine learning"}
  - {id: covid, label: "COVID-19 and Long COVID"}
  - {id: pediatrics-ehr, label: "Pediatric EHR research"}
  - {id: hiv-id, label: "HIV and infectious diseases"}
  - {id: child-health, label: "Child health and development"}
  - {id: digital-health, label: "Digital health and wearables"}

# Python regexes, case-insensitive, matched with re.search against
# title + " " + venue. Per-work topics in overrides are added to these.
topic_rules:
  causal-ml:
    - 'causal'
    - 'targeted (maximum likelihood|learning|machine learning)'
    - '\btmle\b'
    - 'super ?learner'
    - 'highly adaptive lasso'
    - 'target(ed)? trial'
    - 'machine learning'
    - 'treatment heterogeneity'
    - 'heterogeneous treatment effect'
    - 'nonparametric inference'
    - 'artificial intelligence'
    - 'large language model'
    - '\bllms?\b'
  covid:
    - 'covid'
    - 'sars-cov-2'
    - 'coronavirus'
    - '\bn3c\b'
    - 'post-acute sequelae'
    - '\bpasc\b'
  pediatrics-ehr:
    - 'pedsnet'
    - 'epic cosmos'
    - 'pcornet'
    - 'health data warehouse'
    - '^(?=.*\bp(a)?ediatric)(?=.*(electronic health record|\behrs?\b|\bn3c\b|cohort collaborative|real-world data))'
  hiv-id:
    - '\bhiv\b'
    - 'antibiotic'
    - 'antimicrobial'
    - 'infection prevention'
    - 'infection control'
    - 'infectious disease'
    - 'ring trial'
  child-health:
    - '\bchild'
    - '\binfant'
    - 'pregnan'
    - 'perinatal'
    - 'bangladesh'
    - 'wash benefits'
  digital-health:
    - 'wearable'
    - 'digital biomarker'
    - 'digital (health|phenotyp)'
    - 'digital .{0,40}intervention'
    - '\bmhealth\b'
    - 'smartphone'

# CV DOIs that are not on ORCID, so discovery cannot miss them.
include_dois:
  - "10.1093/ofid/ofag560"                 # Wang et al. 2026, OFID (multimorbidity)
  - "10.1016/s2352-3018(25)00302-9"        # Yang et al. 2026, Lancet HIV
  - "10.52202/085713-4650"                 # McCoy, Wu, Butzin-Dozier 2025, NeurIPS

# Never shown. Duplicates and records that are not separate works.
hide:
