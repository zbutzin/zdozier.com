  # UNC Carolina Digital Repository deposits of published papers (OpenAlex lists them as articles)
  - "10.17615/xhdk-h129"       # copy of 10.1016/j.ebiom.2024.105333
  - "10.17615/qzk6-0023"       # copy of 10.1186/s12916-024-03655-x
  - "10.17615/58j5-x854"       # copy of 10.1136/bmjdrc-2024-004536
  - "10.17615/7x87-z790"       # copy of 10.1155/pedi/3545727
  - "10.17615/hymg-0n25"       # copy of 10.1093/ofid/ofaf731
  - "10.17615/0sh5-mt86"       # copy of 10.2196/67585
  - "10.17615/3br4-ep29"       # copy of 10.1016/s2352-3018(25)00302-9
  - "10.17615/pg75-rh65"       # copy of 10.1016/j.ebiom.2026.106382
  - "10.17615/a2qk-mm89"       # copy of 10.1093/ofid/ofag560
  # Peer reviews he wrote for Rapid Reviews: Infectious Diseases (listed under Peer Review Activities instead)
  - "10.1162/2e3983f5.ce1c98c7"
  - "10.1162/2e3983f5.c3345096"

# Versions of one paper. Published DOI first. Groups marked "needed" have a
# title change large enough that fuzzy matching (ratio >= 0.88) misses them;
# the others are listed so linking does not depend on Crossref relations.
same_as:
  - ["10.1016/j.ebiom.2026.106382", "10.1101/2025.04.22.25326224"]                          # vaccination timing
  - ["10.1186/s12916-024-03655-x", "10.1101/2024.02.05.24302352"]                           # SSRI, BMC Medicine (needed, ratio 0.85)
  - ["10.2196/67585", "10.2196/preprints.67585", "10.1101/2024.10.07.24315026"]            # wear time, JMIR Form Res (needed for medRxiv, ratio 0.81)
  - ["10.1038/s41467-024-55801-x", "10.1101/2024.05.10.24307069"]                           # antibiotic use, Nat Commun (needed, ratio 0.72)
  - ["10.1016/s2352-3018(25)00302-9", "10.2139/ssrn.5273921"]                               # HIV testing, Lancet HIV (needed, ratio 0.77)
  - ["10.2196/54622", "10.2196/preprints.54622", "10.1101/2023.10.13.23296965"]             # wearables PPD, JMIR mHealth
  - ["10.2196/53322", "10.2196/preprints.53322", "10.1101/2023.07.27.23293272"]             # Super Learner, JMIR PH&S
  - ["10.1016/j.psyneuen.2024.107023", "10.1101/2023.09.12.23295429"]                       # stress biomarkers
  - ["10.1371/journal.pntd.0012881", "10.1101/2024.03.21.24304684"]                         # treatment heterogeneity, PLOS NTD
  - ["10.2196/68143", "10.2196/preprints.68143"]                                            # HIV phenotyping, JMIR Med Inform
  - ["10.1186/s12889-022-13073-4", "10.21203/rs.3.rs-455696/v1"]                            # antibiotic use Ecuador, BMC Public Health
# Note: 10.64898/2026.07.06.26357401 (SSRI and Long COVID symptoms, 2026) is a
# separate study from 10.1186/s12916-024-03655-x and must not be linked to it.

# Keyed by lowercase DOI. One entry per DOI: to change a DOI that is already
# listed, add lines inside its entry (a repeated key stops the build).
# Besides the work fields (type, status, status_note, topics, featured,
# contribution, code_url, oa_url, role, ...), two keys adjust the author list:
#   group_author: "Name"     adds a consortium to the end of the byline
#   authors_source: crossref uses one source's author list as is
#                            (crossref, europepmc, openalex, or orcid)
overrides:
  # Peer-reviewed journal articles (original research), CV order
  "10.64898/2026.07.06.26357398":          # CV 1, Metformin (preprint; accepted)
    type: article                          # accepted journal article; the CV lists it under original research
    status: accepted
    status_note: "Diabetes, Obesity and Metabolism"
    topics: [covid, causal-ml]
    code_url: "https://github.com/zbutzin/LongCOVID"
  "10.1093/ofid/ofag560":                  # CV 2
    authors_source: crossref               # the CV lists Crossref's full author list ("... Zhang, X. T."); the journal byline ends with the N3C group
    topics: [covid, hiv-id]
    contribution: "Supported causal inference considerations in the study design, analysis, and interpretation. I reviewed the manuscript and provided written feedback. I also provided insights regarding addressing heterogeneous healthcare utilization and COVID-19 sequelae in N3C."
  "10.1016/j.ebiom.2026.106382":           # CV 4, vaccination timing
    featured: true
    topics: [covid, causal-ml]
  "10.1377/hlthaff.2025.00179":            # CV 5, "Racial bias in Long COVID diagnosis"
    group_author: "the National COVID Cohort Collaborative (N3C) Consortium"   # in the CV byline; no source reports it
    featured: true
    topics: [covid]
  "10.1016/j.cdnut.2025.107596":           # CV 6
    topics: [child-health]
    contribution: "I conducted a literature review, supported study design and hypothesis formation, supported manuscript drafting and editing, and informed interpretation of results."
  "10.1093/ofid/ofaf731":                  # CV 7
    topics: [covid, hiv-id]
    contribution: "Supported study design, causal inference considerations, incorporation of heterogeneous healthcare utilization, interpretation of results, and manuscript editing."
  "10.1155/pedi/3545727":                  # CV 8
    topics: [covid, pediatrics-ehr]
    contribution: "I was invited to join this project as an expert in causal inference. I helped contextualize subgroup findings, given the risk of false discoveries from multiple testing. Furthermore, I evaluated potential sources of bias, including unmeasured confounding, and how these biases may influence the observed results. I supported the interpretation of results, manuscript review and editing, and the writing of the discussion."
  "10.1016/s2352-3018(25)00302-9":         # CV 9
    topics: [hiv-id, covid]
    contribution: "Supported data analysis and troubleshooting of analytic pipeline in N3C. Proposed alternative interpretations and potential limitations of study design. Reviewed and revised manuscript draft."
  "10.2196/68143":                         # CV 10
    topics: [hiv-id]
    contribution: "Supported methodologic troubleshooting and data processing. Supported writing and revision of manuscript."
  "10.2196/67585":                         # CV 11
    topics: [digital-health]
    contribution: "Contributed to study design and causal inference considerations. Reviewed, edited, and provided feedback for the manuscript."
  "10.1371/journal.pntd.0012881":          # CV 12
    featured: true
    topics: [child-health, causal-ml]
  "10.1038/s41598-025-90505-2":            # CV 13
    topics: [child-health]
    contribution: "Supported data analysis, literature review, and interpretation of findings. Reviewed and revised manuscript draft."
  "10.1038/s41467-024-55801-x":            # CV 14
    topics: [child-health, hiv-id]
    contribution: "Generated all manuscript figures and tables. Reviewed and revised manuscript."
  "10.1136/bmjdrc-2024-004536":            # CV 15
    topics: [covid]
    contribution: "Reviewed, edited, and provided feedback for manuscript draft. Discussed interpretation with first author and shared additional limitations."
  "10.1186/s12916-024-03655-x":            # CV 16, SSRI (BMC Medicine)
    featured: true
    topics: [covid, causal-ml]
  "10.1016/j.ebiom.2024.105333":           # CV 17
    topics: [covid]
    contribution: "Reviewed, edited, and provided feedback for manuscript draft. Led award-winning team entry, which was featured in this manuscript."
  "10.1016/j.psyneuen.2024.107023":        # CV 18
    featured: true
    topics: [child-health]
  "10.2196/54622":                         # CV 19
    topics: [digital-health]
    contribution: "Designed analysis and supported troubleshooting of analytic pipeline. Supported writing of first-draft manuscript and reviewed and edited final manuscript version."
  "10.2196/53322":                         # CV 20, Super Learner
    featured: true
    topics: [covid, causal-ml]
  "10.1186/s12889-022-13073-4":            # CV 21
    topics: [hiv-id]
    contribution: "Conducted study design, data collection, and portions of data analysis. Wrote first draft of manuscript sections. Reviewed, edited, and provided feedback on final manuscript draft."
  "10.3390/antibiotics10010002":           # CV 22
    featured: true
    topics: [hiv-id]
  "10.3396/ijic.v17.20628":                # CV 23
    issue: "1"                             # CV gives 17(1); Crossref has no issue
    oa_url: null                           # OpenAlex's full-text link (ijic.info/article/download/20628/14187) returns 404
    topics: [hiv-id]
    contribution: "Mentored undergraduate student in manuscript preparation. Reviewed, edited, and provided feedback on manuscript draft. Iterated on overall manuscript format and focus."
  "10.1001/archpediatrics.2010.54":        # CV 24
    topics: [child-health]
    contribution: "Designed study and conducted data analysis. Reviewed, edited, and provided feedback for manuscript draft."

  # Peer-reviewed review article
  "10.1093/epirev/mxac003":                # ring trial review
    type: review
    featured: true
    topics: [hiv-id]

  # Peer-reviewed conference paper
