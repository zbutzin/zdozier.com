# Person, links, research themes, and software selection (curated content).
person:
  name: "Zachary B. Dozier"
  name_with_degrees: "Zachary B. Dozier, PhD, MPH"
  short_name: "Zach Dozier"
  former_name: "Zachary Butzin-Dozier"
  title: "Assistant Professor"
  appointments_short:
    - "Pediatrics (Clinical Informatics)"
    - "Medicine (Computational Medicine)"
  institution: "Stanford University School of Medicine"
  email: "zdozier@stanford.edu"
  address: "3145 Porter Drive, Palo Alto, CA 94304"
  tagline: "Machine learning for causal inference with electronic health records"
  bio: |
    Zach Dozier is an Assistant Professor at Stanford University in the Department of Pediatrics, Division of Clinical Informatics, with a joint appointment in the Department of Medicine, Division of Computational Medicine. He is an affiliate of the Center for Targeted Machine Learning (CTML) at UC Berkeley and an NIAID K01 recipient. He received his PhD in Epidemiology and MPH from UC Berkeley.

    His research applies machine learning and artificial intelligence for causal inference via electronic health record data. He draws from large-scale databases, such as the UC Health Data Warehouse, Epic Cosmos, PEDSnet, and the National Clinical Cohort Collaborative, to answer pressing questions in pediatric and infectious disease medicine. This work evaluates vaccine effectiveness, drug repurposing, and the long-term sequelae of viral infection, including Long COVID. He aims to bridge rigorous biostatistical methodology with clinically meaningful research questions.

