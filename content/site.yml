# Home page themes. Representative papers are pulled by topic id
# (see content/publications.yml: topics), featured first, then most recent.
research_themes:
  - id: causal-ml-methods
    title: "Causal machine learning for real-world data"
    summary: "Methods for drawing causal conclusions from electronic health records and other observational data, including targeted learning, Super Learner, the highly adaptive lasso, and target trial emulation."
    topics: [causal-ml]
  - id: long-covid
    title: "Long COVID and post-acute outcomes"
    summary: "Studies in the National Clinical Cohort Collaborative (N3C) that evaluate existing medications, such as SSRIs, metformin, GLP-1 medications, and IL-6 receptor antagonists, as interventions against Long COVID and severe post-COVID-19 outcomes. Related work examines the timing of COVID-19 vaccination and racial bias in Long COVID diagnosis."
    topics: [covid]
  - id: pediatric-ehr
    title: "Pediatric health research with electronic health records"
    summary: "The lab at Stanford applies artificial intelligence and machine learning for causal inference to electronic health record data to improve pediatric health, using Epic Cosmos, PEDSnet, PCORnet, the UC Health Data Warehouse, and N3C."
    topics: [pediatrics-ehr]
  - id: child-global-health
    title: "Child growth and development in global health"
    summary: "Analyses of data from the WASH Benefits Bangladesh Project, several using targeted learning, on child growth, development, stress biomarkers, and antibiotic use. Earlier mixed-methods research examined antimicrobial resistance in Ecuador."
    topics: [child-health]

# Public repos of identity.github_user. include is the display order and
# is shown even when a repo is a fork (HAL-in-R and TMLEbootstrap are forks).
software:
  include:
    - LongCOVID
    - TMLEbootstrap
    - HAL-in-R
    - ipv-dep-stress-telo
  exclude:
    - Intervention-Trials-Fall-2019     # course materials
    - Intervention-Trials-GSIs-F2019    # course materials
  # Shown instead of the repository's GitHub description. One plain sentence;
  # repos not listed here keep their GitHub description.
  descriptions:
    ipv-dep-stress-telo: "Analysis code for intimate partner violence, maternal depression, parental stress, and child telomere length in Bangladesh"
    HAL-in-R: "Example R code for the highly adaptive lasso (HAL): undersmoothed fits and delta-method confidence intervals for treatment effects"   # from the repo's Demo.Rmd (October 2026)
  # Shown instead of GitHub's language label, which counts rendered HTML
  # output (HAL-in-R reads as "HTML") or is empty (TMLEbootstrap).
  languages:
    HAL-in-R: R
    TMLEbootstrap: R
